<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Nexo Concierge: atendente de WhatsApp com IA que agenda horários">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#0b0718"/></linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="wa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- title block -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="80" y="130" rx="18" width="206" height="36" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="102" y="154" font-size="16" font-weight="700" letter-spacing="2.4" fill="#ddd6fe">AUTOMAÇÃO · N8N</text>
    <text x="80" y="262" font-size="92" font-weight="800" fill="#fff" letter-spacing="-2">Nexo</text>
    <text x="80" y="352" font-size="92" font-weight="800" fill="url(#brand)" letter-spacing="-2">Concierge</text>
    <text x="80" y="418" font-size="30" font-weight="500" fill="#c4b5fd">Atendente de WhatsApp com IA</text>
    <text x="80" y="458" font-size="30" font-weight="500" fill="#c4b5fd">que agenda, remarca e cancela.</text>
    <g font-size="19" font-weight="600" fill="#e9e5ff">
      <rect x="80" y="520" rx="22" width="150" height="44" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.15"/><text x="104" y="549">Texto</text>
      <rect x="246" y="520" rx="22" width="150" height="44" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.15"/><text x="272" y="549">Áudio</text>
      <rect x="412" y="520" rx="22" width="150" height="44" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.15"/><text x="440" y="549">Imagem</text>
    </g>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)" transform="translate(760 70)">
    <rect width="380" height="580" rx="44" fill="#0f0a20" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="3"/>
    <rect x="16" y="16" width="348" height="548" rx="32" fill="#16102b"/>
    <rect x="16" y="16" width="348" height="84" rx="32" fill="url(#wa)"/>
    <rect x="16" y="68" width="348" height="32" fill="url(#wa)"/>
    <circle cx="62" cy="58" r="22" fill="#fff" fill-opacity="0.95"/>
    <path d="M52 62l7-14 3 9 3-5 5 10z" fill="#059669"/>
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="96" y="55" font-size="20" font-weight="700" fill="#fff">Concierge IA</text>
      <text x="96" y="77" font-size="14" fill="#d1fae5">online agora</text>
      <!-- customer -->
      <rect x="84" y="128" rx="18" width="260" height="52" fill="#312e81"/><text x="102" y="160" font-size="17" fill="#e0e7ff">Quero cortar amanhã às 15h</text>
      <!-- bot -->
      <rect x="36" y="200" rx="18" width="276" height="76" fill="#241a44"/>
      <text x="54" y="232" font-size="17" fill="#ede9fe">Oi! Tenho 15h com o João.</text>
      <text x="54" y="258" font-size="17" fill="#ede9fe">Posso confirmar? ✨</text>
      <rect x="248" y="296" rx="18" width="96" height="44" fill="#312e81"/><text x="274" y="325" font-size="17" fill="#e0e7ff">Pode!</text>
    </g>
    <!-- booking confirmation card -->
    <g transform="translate(36 362)">
      <rect width="308" height="176" rx="20" fill="#fff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
      <rect x="20" y="20" width="56" height="62" rx="10" fill="url(#brand)"/>
      <rect x="20" y="20" width="56" height="20" rx="10" fill="#4c1d95"/>
      <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff" text-anchor="middle">
        <text x="48" y="35" font-size="11" font-weight="700">NOV</text><text x="48" y="70" font-size="26" font-weight="800">19</text>
      </g>
      <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
        <text x="92" y="44" font-size="18" font-weight="700" fill="#fff">Corte masculino</text>
        <text x="92" y="68" font-size="15" fill="#c4b5fd">Amanhã · 15h com João</text>
      </g>
      <rect x="20" y="108" rx="21" width="268" height="42" fill="url(#wa)"/>
      <path d="M96 129l8 8 15-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="132" y="135" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Agendado</text>
    </g>
  </g>

  <!-- floating AI node -->
  <g transform="translate(1100 30) scale(0.8)" filter="url(#shadow)">
    <rect width="132" height="132" rx="34" fill="url(#brand)"/>
    <path d="M66 28l9 26 26 9-26 9-9 26-9-26-26-9 26-9z" fill="#fff"/>
    <path d="M102 24l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fff" fill-opacity="0.85"/>
  </g>
</svg>
