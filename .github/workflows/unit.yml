name: Backend unit
on:
  push:
    branches: [main]
    paths: ['src/backend/**', 'tests/**', 'pyproject.toml', '.env.example', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['src/backend/**', 'tests/**', 'pyproject.toml', '.env.example', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/unit --junitxml=reports/unit.xml
      - run: ruff check src/backend tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-unit-results
          path: reports/unit.xml
          retention-days: 7
          if-no-files-found: warn
