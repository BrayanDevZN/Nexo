name: Backend functional
on:
  push:
    branches: [main]
    paths: ['src/backend/**', 'tests/**', 'pyproject.toml', '.env.example', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['src/backend/**', 'tests/**', 'pyproject.toml', '.env.example', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/functional
