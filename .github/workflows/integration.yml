name: Backend integration
on:
  push:
    branches: [main]
    paths: ['src/backend/**', 'tests/**', 'pyproject.toml', '.env.example', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['src/backend/**', 'tests/**', 'pyproject.toml', '.env.example', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/integration
