name: Backend integration
on:
  push:
    branches: [main]
    paths: ['src/backend/**', 'tests/**', 'pyproject.toml', '.env.example', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['src/backend/**', 'tests/**', 'pyproject.toml', '.env.example', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/integration --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-integration-results
          path: reports/integration.xml
          retention-days: 7
          if-no-files-found: warn
