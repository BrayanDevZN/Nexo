[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-backend"
version = "0.1.0"
description = "Backend administrativo da Nexo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "sqlalchemy>=2.0,<3", "redis>=5,<8", "bcrypt>=4,<6",
  "PyJWT>=2.10,<3", "yagmail>=0.15,<1", "authlib>=1.4,<2",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
nexo = "backend.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
