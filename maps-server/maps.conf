# Maps server: valida a API key da Nexo antes de repassar pro scraper.
# Colocar em /etc/nginx/conf.d/ (este arquivo fica dentro do bloco http).
#
# Fluxo: cliente -> nginx -> GET /auth/api-keys/validate na Nexo (auth_request)
#        -> se 200, repassa pro scraper; se 401, devolve 401.

# Scraper (nome do serviço no docker compose). Troque se for outro host/porta.
upstream maps_scraper {
    server google-maps-scraper:8080;
}

# Cache do resultado da validação, pra não consultar a Nexo a cada request.
proxy_cache_path /var/cache/nginx/nexo_auth keys_zone=nexo_auth:1m max_size=1m inactive=5m;

server {
    listen 80;
    server_name _;

    location = /_health {
        auth_request off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pergunta pra Nexo se a key é válida (2xx = sim, 401 = não).
    location = /_auth {
        internal;
        proxy_pass https://nexo-production-60a0.up.railway.app/auth/api-keys/validate;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host nexo-production-60a0.up.railway.app;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_cache nexo_auth;
        proxy_cache_key $http_authorization;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 401 10s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @denied;
        error_page 500 502 503 504 = @auth_unavailable;

        proxy_pass http://maps_scraper;
        proxy_set_header Host $host;
        # A key da Nexo é só pro nginx, não vai pro scraper.
        proxy_set_header Authorization "";
        client_max_body_size 10m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location @denied {
        default_type application/json;
        return 401 '{"error":"invalid or missing API key"}';
    }

    location @auth_unavailable {
        default_type application/json;
        return 503 '{"error":"service unavailable"}';
    }
}
